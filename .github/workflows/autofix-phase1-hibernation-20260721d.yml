name: autofix-phase1-hibernation-20260721d

on:
  pull_request:

jobs:
  hibernated-e2e:
    name: Auto-fix Hibernated E2E QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hibernate while state is red
        run: |
          if [ "$(cat .autofix-hibernation-state)" = "red" ]; then
            sleep 1020
          fi
      - name: Assert hibernation state is green
        run: test "$(cat .autofix-hibernation-state)" = "green"
